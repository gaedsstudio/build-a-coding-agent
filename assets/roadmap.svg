    <text x="458" y="353" font-size="17" font-weight="700" fill="#F0F6FC">Code Search</text>
    <text x="458" y="379" font-size="13" fill="#8B949E">find relevant code</text>
  </g>
  <g>
    <rect x="806" y="288" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="830" cy="313" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="854" y="318" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">06</text>
    <text x="830" y="353" font-size="17" font-weight="700" fill="#F0F6FC">Context Management</text>
    <text x="830" y="379" font-size="13" fill="#8B949E">spend tokens carefully</text>
  </g>
  <g>
    <rect x="1178" y="288" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="1202" cy="313" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="1226" y="318" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">07</text>
    <text x="1202" y="353" font-size="17" font-weight="700" fill="#F0F6FC">Planning</text>
    <text x="1202" y="379" font-size="13" fill="#8B949E">separate plan from action</text>
  </g>

  <g>
    <rect x="62" y="426" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="86" cy="451" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="110" y="456" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">08</text>
    <text x="86" y="491" font-size="17" font-weight="700" fill="#F0F6FC">Git Diff</text>
    <text x="86" y="517" font-size="13" fill="#8B949E">inspect changes</text>
  </g>
  <g>
    <rect x="434" y="426" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="458" cy="451" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="482" y="456" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">09</text>
    <text x="458" y="491" font-size="17" font-weight="700" fill="#F0F6FC">Patch &amp; Rollback</text>
    <text x="458" y="517" font-size="13" fill="#8B949E">make edits reversible</text>
  </g>
  <g>
    <rect x="806" y="426" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="830" cy="451" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="854" y="456" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">10</text>
    <text x="830" y="491" font-size="17" font-weight="700" fill="#F0F6FC">Sandbox</text>
    <text x="830" y="517" font-size="13" fill="#8B949E">isolate execution</text>
  </g>
  <g>
    <rect x="1178" y="426" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="1202" cy="451" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="1226" y="456" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">11</text>
    <text x="1202" y="491" font-size="17" font-weight="700" fill="#F0F6FC">Permissions</text>
    <text x="1202" y="517" font-size="13" fill="#8B949E">approval boundaries</text>
  </g>

  <g>
    <rect x="62" y="564" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="86" cy="589" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="110" y="594" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">12</text>
    <text x="86" y="629" font-size="17" font-weight="700" fill="#F0F6FC">Subagents</text>
    <text x="86" y="655" font-size="13" fill="#8B949E">delegate focused work</text>
  </g>
  <g>
    <rect x="434" y="564" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="458" cy="589" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="482" y="594" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">13</text>
    <text x="458" y="629" font-size="17" font-weight="700" fill="#F0F6FC">Agent Skills</text>
    <text x="458" y="655" font-size="13" fill="#8B949E">reusable workflows</text>
  </g>
  <g>
    <rect x="806" y="564" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="830" cy="589" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="854" y="594" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">14</text>
    <text x="830" y="629" font-size="17" font-weight="700" fill="#F0F6FC">Context Compression</text>
    <text x="830" y="655" font-size="13" fill="#8B949E">keep long runs useful</text>
  </g>
  <g>
    <rect x="1178" y="564" width="350" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="1202" cy="589" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="1226" y="594" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">15</text>
    <text x="1202" y="629" font-size="17" font-weight="700" fill="#F0F6FC">Evals</text>
    <text x="1202" y="655" font-size="13" fill="#8B949E">measure improvement</text>
  </g>

  <g>
    <rect x="62" y="720" width="420" height="116" rx="14" fill="#0D1117" stroke="#30363D" stroke-dasharray="6 5"/>
    <circle cx="86" cy="745" r="9" fill="none" stroke="#6E7681" stroke-width="1.3"/>
    <text x="110" y="750" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">16</text>
    <text x="86" y="785" font-size="17" font-weight="700" fill="#F0F6FC">Full Agent</text>
    <text x="86" y="811" font-size="13" fill="#8B949E">put it together</text>
  </g>

  <path d="M510 778H908" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="707" cy="778" r="4" fill="#58A6FF"/>
  <text x="707" y="762" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#6E7681">FROM BASICS TO A REAL AGENT</text>

  <g transform="translate(936 720)">
    <rect width="602" height="116" rx="14" fill="#111827" stroke="#58A6FF"/>
    <text x="26" y="43" font-size="18" font-weight="700" fill="#F0F6FC">Build it small. Understand it deeply.</text>
    <text x="26" y="72" font-size="14" fill="#8B949E">The goal is not another framework.</text>
    <text x="26" y="94" font-size="14" fill="#8B949E">The goal is to know what the framework is hiding.</text>
  </g>

  <text x="62" y="875" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#484F58">BUILD-A-CODING-AGENT / ROADMAP</text>
</g>
</svg>