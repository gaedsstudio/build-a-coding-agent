<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Learning roadmap</title>
<desc id="desc">Roadmap from a first model call to a complete educational coding agent.</desc>
<rect width="1600" height="900" rx="22" fill="#0D1117"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <text x="62" y="68" font-size="34" font-weight="750" fill="#F0F6FC">Learning roadmap</text>
  <text x="62" y="99" font-size="15" fill="#8B949E">One concept per chapter. Every step stays runnable.</text>

  <g transform="translate(1110 54)" font-size="12">
    <circle cx="7" cy="7" r="6" fill="#238636"/><path d="M4 7l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.4"/><text x="22" y="11" fill="#8B949E">complete</text>
    <rect x="98" y="0" width="14" height="14" rx="4" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/><text x="120" y="11" fill="#8B949E">next</text>
    <rect x="180" y="0" width="14" height="14" rx="4" fill="#0D1117" stroke="#30363D" stroke-dasharray="3 3"/><text x="202" y="11" fill="#8B949E">planned</text>
  </g>

  <g>
    <rect x="62" y="150" width="350" height="116" rx="14" fill="#111827" stroke="#2EA043"/>
    <circle cx="86" cy="175" r="9" fill="#238636"/><path d="M81 175l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="110" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">00</text>
    <text x="86" y="215" font-size="17" font-weight="700" fill="#F0F6FC">Hello Agent</text>
    <text x="86" y="241" font-size="13" fill="#8B949E">first model call</text>
  </g>
  <g>
    <rect x="434" y="150" width="350" height="116" rx="14" fill="#111827" stroke="#2EA043"/>
    <circle cx="458" cy="175" r="9" fill="#238636"/><path d="M453 175l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="482" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">01</text>
    <text x="458" y="215" font-size="17" font-weight="700" fill="#F0F6FC">Agent Loop</text>
    <text x="458" y="241" font-size="13" fill="#8B949E">conversation state</text>
  </g>
  <g>
    <rect x="806" y="150" width="350" height="116" rx="14" fill="#111827" stroke="#2EA043"/>
    <circle cx="830" cy="175" r="9" fill="#238636"/><path d="M825 175l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="854" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">02</text>
    <text x="830" y="215" font-size="17" font-weight="700" fill="#F0F6FC">Tool Calling</text>
    <text x="830" y="241" font-size="13" fill="#8B949E">request + execute</text>
  </g>
  <g>
    <rect x="1178" y="150" width="350" height="116" rx="14" fill="#111827" stroke="#2EA043"/>
    <circle cx="1202" cy="175" r="9" fill="#238636"/><path d="M1197 175l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="1226" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E7681">03</text>
    <text x="1202" y="215" font-size="17" font-weight="700" fill="#F0F6FC">Filesystem</text>
    <text x="1202" y="241" font-size="13" fill="#8B949E">read + write files</text>
  </g>

  <g>
