    <text x="86" y="353" font-size="17" font-weight="700" fill="#F0F6FC">Shell Execution</text>
    <text x="86" y="379" font-size="13" fill="#8B949E">run constrained commands</text>
  </g>
  <g>
    <rect x="434" y="288" width="350" height="116" rx="14" fill="#111827" stroke="#58A6FF"/>
    <rect x="449" y="304" width="18" height="18" rx="5" fill="#161B22" stroke="#58A6FF" stroke-width="1.7"/>
